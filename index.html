<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Points Noirs — Districts d'Oujda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#1c2430;--line:#dfe4ea;--muted:#6b7686;--accent:#0a5c4a;--bg:#f4f6f8;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
#map{position:fixed;inset:0;z-index:1}
/* Top bar shared by district tabs AND nature tabs — same design/placement */
.topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1000;
 display:flex;gap:10px;flex-wrap:nowrap;justify-content:center;max-width:calc(100vw - 320px);
 overflow-x:auto;padding:2px}
.topbar.hidden{display:none}
#naturebar{flex-wrap:wrap;overflow-x:visible;max-width:calc(100vw - 380px);row-gap:8px}
#naturebar .tab{padding:7px 13px;font-size:12.5px}
.tab{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border:1px solid var(--line);
 border-radius:12px;box-shadow:0 6px 20px rgba(20,30,45,.12);cursor:pointer;font-weight:650;font-size:13.5px;
 transition:transform .12s,box-shadow .12s,opacity .12s;user-select:none;white-space:nowrap;flex:0 0 auto}
.tab:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,30,45,.18)}
.tab .dot{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.15);flex:0 0 auto}
.tab .cnt{font-size:11px;color:var(--muted);font-weight:600;background:var(--bg);padding:1px 7px;border-radius:8px}
.tab.off{opacity:.42}
.back{position:absolute;top:14px;left:14px;z-index:1001;display:none;align-items:center;gap:7px;
 padding:9px 15px;background:#fff;border:1px solid var(--line);border-radius:12px;
 box-shadow:0 6px 20px rgba(20,30,45,.14);cursor:pointer;font-weight:650;font-size:13px}
.back.show{display:flex}
#home{left:14px}
#back{left:70px}
#tabhost{display:contents}
#burger,#drawerbg{display:none}
.sheetgrab{display:none}
.stats{position:absolute;top:14px;right:14px;bottom:14px;z-index:1000;width:316px;max-width:calc(100vw - 28px);
 background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(20,30,45,.16);
 overflow:hidden;display:none;flex-direction:column}
.stats.show{display:flex}
.stats header{padding:16px 18px 12px;background:linear-gradient(135deg,var(--accent),#0d7a61)}
.stats header h2{margin:0;font-size:15px;color:#fff;font-weight:700}
.stats header .sub{margin:3px 0 0;font-size:12px;color:rgba(255,255,255,.85)}
.stats .total{padding:11px 18px;display:flex;gap:24px;border-bottom:1px solid var(--line)}
.statnat{display:none;padding:12px 18px 2px}
.statnat.show{display:block}
.statnat .nb{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:20px;color:#fff;font-weight:700;font-size:12.5px}
.statnat .nb .d{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block}
.stats .total .metric{display:flex;flex-direction:column;gap:2px}
.stats .total .n{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.stats .total .l{font-size:11.5px;color:var(--muted);font-weight:600}
.chartwrap{padding:14px 16px 6px;border-bottom:1px solid var(--line)}
.chartwrap canvas{max-height:172px}
.stats .body{padding:8px 12px 14px;flex:1;overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:5px 6px}
.bcount{padding:12px 18px 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.bcount b{color:var(--accent);font-size:15px}
.blrow{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12px;font-weight:600;border-bottom:1px solid #f0f2f5;cursor:pointer;border-radius:8px}
.blrow:hover{background:var(--bg)}
.blrow.sel{background:var(--bg)}
.blrow .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.blrow .bnm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blrow .sevchip{flex:0 0 auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.tlist-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.tlist-toggle .chev{color:var(--muted);font-size:10px;transition:transform .18s}
.tlist-toggle.open .chev{transform:rotate(180deg)}
.tlist-body{display:none;max-height:260px;overflow-y:auto}
.tlist-body.open{display:block}
.blrow.sel .bnm{color:var(--accent);font-weight:700}
.srow .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.srow .nm{flex:1;font-size:12.5px;font-weight:600}
.srow .bar{height:8px;border-radius:5px;min-width:4px;transition:width .4s}
.srow .v{font-size:12.5px;font-weight:700;width:22px;text-align:right}
.barwrap{flex:1;background:var(--bg);border-radius:5px;overflow:hidden}
.leaflet-tooltip.lbl{background:rgba(255,255,255,.82);border:none;box-shadow:none;font-weight:700;
 font-size:12px;color:#1c2430;padding:2px 6px}
.leaflet-tooltip.alabel{background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.1);
 font-weight:700;font-size:11px;color:#1c2430;padding:2px 6px;border-radius:5px}
.pn-pop b{font-size:13px}.pn-pop{font-size:12px;line-height:1.5}
.dbody{padding:16px 18px;overflow:auto;flex:1}
.dbody .field{margin-bottom:14px}
.dbody .flabel{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.dbody .fval{font-size:14px;font-weight:600}
.dbody .natbadge{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:20px;color:#fff;font-weight:700;font-size:13px}
.dbody img{width:100%;height:190px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:2px;background:var(--bg);cursor:zoom-in;display:block}
.slider{position:relative;margin-top:2px;height:190px}
.slider .sstage,.slider .sstage img{height:190px}
.slider .sstage img{width:100%;object-fit:cover;margin-top:0}
#lightbox{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(10,15,22,.86)}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:80vh;width:auto;height:auto;border-radius:10px;box-shadow:0 12px 46px rgba(0,0,0,.6);background:#0a0f16}
#lbclose{position:absolute;top:16px;right:18px;width:46px;height:46px;border:none;border-radius:50%;background:rgba(255,255,255,.92);color:#111;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#lbclose:hover{background:#fff}
#baseswitch{position:fixed;left:14px;bottom:16px;z-index:2200;display:flex;background:rgba(255,255,255,.94);border-radius:22px;box-shadow:0 4px 16px rgba(20,30,45,.28);overflow:hidden;font-family:inherit}
#baseswitch .bs{border:none;background:transparent;padding:9px 16px;font-size:13px;font-weight:700;color:#48566a;cursor:pointer}
#baseswitch .bs.on{background:var(--accent,#0a5c4a);color:#fff}
.axistoggle{display:flex;gap:0;margin:11px 16px 2px;background:var(--bg);border-radius:20px;padding:3px}
.axistoggle button{flex:1;border:none;background:transparent;padding:7px 4px;font-size:11.5px;font-weight:700;color:#5b6b7b;cursor:pointer;border-radius:16px;white-space:nowrap}
.axistoggle button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(20,30,45,.14)}
.schooltoggle{display:flex;gap:0;margin:11px 16px 2px;background:var(--bg);border-radius:20px;padding:3px}
.schooltoggle button{flex:1;border:none;background:transparent;padding:7px 4px;font-size:11.5px;font-weight:700;color:#5b6b7b;cursor:pointer;border-radius:16px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.schooltoggle button .stdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.schooltoggle button.on{background:#fff;box-shadow:0 1px 4px rgba(20,30,45,.14)}
.schooltoggle button .stcnt{font-weight:800}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:none;border-radius:50%;background:rgba(255,255,255,.9);color:#111;font-size:26px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.lbnav:hover{background:#fff}
#lbprev{left:18px}#lbnext{right:18px}
#lbcount{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(10,15,22,.7);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:12px}
.snav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:50%;
 background:rgba(28,36,48,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.snav:hover{background:rgba(28,36,48,.85)}
.sprev{left:8px}.snext{right:8px}
.scount{position:absolute;bottom:8px;right:8px;background:rgba(28,36,48,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.dbody .maps{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;padding:11px;
 background:var(--accent);color:#fff;border-radius:12px;font-weight:700;font-size:13.5px;text-decoration:none}
.dbody .maps:hover{background:#0d7a61}
.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:1000;
 background:rgba(28,36,48,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:500}
#tload{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:1200;display:none;
 align-items:center;gap:9px;background:rgba(28,36,48,.92);color:#fff;padding:9px 16px;border-radius:20px;
 font-size:12.5px;font-weight:600;box-shadow:0 6px 20px rgba(20,30,45,.25)}
#tload.show{display:flex}
#tload .sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- Géolocalisation ---- */
#geoloc-wrap{position:fixed;right:14px;bottom:16px;z-index:2350;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.csearch-panel{position:absolute;bottom:calc(100% + 10px);right:0;background:#fff;border-radius:14px;
  box-shadow:0 10px 30px rgba(20,30,45,.28);padding:12px;width:230px}
.csearch-panel input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;font-size:13px;margin-bottom:8px;font-family:inherit}
.csearch-panel .cs-go{width:100%;padding:8px;border:none;border-radius:10px;background:var(--accent);
  color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.csearch-result{margin-top:10px;font-size:12.5px;font-weight:600;color:#334;line-height:1.5}
.csearch-result .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:14px;
  color:#fff;font-weight:700;margin-bottom:6px}
.csearch-result .cs-enter{margin-top:6px;width:100%;padding:6px;border:none;border-radius:9px;
  background:var(--bg);color:var(--accent);font-weight:700;cursor:pointer;font-size:12px}
.geo-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 16px rgba(20,30,45,.28);
 font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1c2430;transition:background .15s,color .15s,transform .1s}
.geo-btn:active{transform:scale(.94)}
.geo-btn.on{background:var(--accent);color:#fff}
.geo-btn.follow{width:38px;height:38px;font-size:16px}
.geo-btn.follow.on{background:#0d7a61}
.geo-btn:disabled{opacity:.55;cursor:wait}
#geotoast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160%);z-index:3100;
 background:rgba(28,36,48,.94);color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;
 box-shadow:0 8px 26px rgba(20,30,45,.3);opacity:0;transition:transform .3s ease,opacity .3s ease;max-width:calc(100vw - 28px);text-align:center;pointer-events:none}
#geotoast.show{transform:translateX(-50%) translateY(0);opacity:1}
#geotoast.warn{background:rgba(180,40,40,.94)}
.geo-dotwrap{display:flex;align-items:center;justify-content:center;width:26px;height:26px}
.geo-dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 3px rgba(26,115,232,.35)}
.geo-arrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid #1a73e8;
 filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
@media (max-width:680px){
  #geoloc-wrap{right:8px;bottom:10px;z-index:2350}
  .geo-btn{width:42px;height:42px;font-size:17px}
  .geo-btn.follow{width:34px;height:34px;font-size:14px}
}
@media (max-width:680px){
  /* Panneaux (stats + fiche) en feuille du bas glissable */
  .stats{top:auto;left:6px;right:6px;bottom:6px;width:auto;max-width:none;max-height:40vh;border-radius:18px 18px 16px 16px}
  .stats .body{overflow:auto}
  .stats header{padding:6px 16px 9px}
  .dbody{padding:12px 16px 16px}
  .chartwrap{display:none}
  .stats .total{padding:9px 18px}
  .stats .total .n{font-size:24px}
  .statnat{padding:8px 18px 0}
  .sheetgrab{display:block;padding:8px 0 2px;cursor:grab;touch-action:none}
  .sheetgrab span{display:block;width:44px;height:5px;border-radius:3px;background:#c7ced6;margin:0 auto}
  /* Fond de carte : haut droite, toujours visible */
  #baseswitch{top:10px;right:8px;left:auto;bottom:auto;z-index:2300}
  #baseswitch .bs{padding:8px 13px;font-size:12px}
  /* Boutons accueil / retour (flottants, compacts) */
  .back{top:10px;padding:8px 11px;font-size:13px}
  #home{left:58px}
  #back{left:116px}
  .bk-tx{display:none}      /* retour = flèche seule */
  /* Burger + tiroir contenant districts/natures */
  #burger{display:flex;position:fixed;top:10px;left:8px;z-index:2400;width:42px;height:42px;
    align-items:center;justify-content:center;border:none;border-radius:12px;background:#fff;
    box-shadow:0 6px 20px rgba(20,30,45,.16);font-size:20px;cursor:pointer;color:#1c2430}
  #burger .bico{font-size:20px;line-height:1}
  #burger .blabel{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 3px;
    border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  #drawerbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2550}
  #drawerbg.open{display:block}
  #tabhost{display:block;position:fixed;top:0;left:0;bottom:0;width:82%;max-width:300px;background:#fff;
    z-index:2600;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;
    padding:58px 12px 20px;box-shadow:2px 0 22px rgba(0,0,0,.28)}
  #tabhost.open{transform:none}
  #tabhost .topbar{position:static;left:auto;right:auto;top:auto;transform:none;max-width:none;width:100%;
    display:flex;flex-direction:column;gap:8px;overflow:visible;flex-wrap:nowrap;margin:0;padding:0}
  #tabhost .topbar.hidden{display:none}
  #tabhost .tab{width:100%;justify-content:flex-start;font-size:14px;padding:11px 14px}
  /* Photos plus compactes */
  .dbody img,.slider,.slider .sstage,.slider .sstage img{height:150px}
  /* Message d'aide */
  .hint{font-size:12px;max-width:calc(100vw - 24px);text-align:center;left:50%;transform:translateX(-50%)}
  /* Lightbox */
  .lbnav{width:40px;height:40px;font-size:22px}
  #lbprev{left:8px}#lbnext{right:8px}
  #lbclose{top:10px;right:10px;width:40px;height:40px}
}
</style></head><body>
<div id="map"></div>
<button id="burger" type="button" aria-label="Menu"><span class="bico">☰</span><span class="blabel" id="blabel">D</span></button>
<div id="drawerbg"></div>
<div class="back" id="home" style="padding:9px 12px;font-size:16px">🏠</div>
<div class="back" id="back"><span class="bk-ic">←</span><span class="bk-tx"> Retour</span></div>
<div id="tabhost">
  <div class="topbar" id="topbar"></div>
  <div class="topbar hidden" id="naturebar"></div>
</div>
<div class="stats" id="stats">
 <div class="sheetgrab"><span></span></div>
 <header><h2 id="stitle">District</h2><p class="sub">Points noirs par nature</p></header>
 <div class="statnat" id="statnat"></div>
 <div class="axistoggle" id="axistoggle">
   <button type="button" data-a="all" class="on">Tous</button>
   <button type="button" data-a="grand">Grands axes</button>
   <button type="button" data-a="sec">Axes secondaires</button>
 </div>
 <div class="total">
   <div class="metric"><span class="n" id="stotal">0</span><span class="l">points noirs</span></div>
   <div class="metric"><span class="n" id="sboul">0</span><span class="l">boulevards concernés</span></div>
 </div>
 <div class="chartwrap"><canvas id="chart"></canvas></div>
 <div class="body" id="sbody"></div>
</div>
<div class="stats" id="detail">
 <div class="sheetgrab"><span></span></div>
 <header><h2 id="dtitle">Point noir</h2><p class="sub" id="dsub">Détail</p></header>
 <div class="dbody" id="dbody"></div>
</div>
<div class="hint" id="hint">Clique sur une étiquette de district pour l'explorer</div>
<div id="tload"><span class="sp"></span><span id="tloadtxt">Tracé des boulevards…</span></div>
<div id="baseswitch"><button type="button" class="bs on" data-l="osm">Plan</button><button type="button" class="bs" data-l="sat">Satellite</button></div>
<div id="geoloc-wrap">
  <button id="csearch-btn" class="geo-btn" type="button" title="Chercher des coordonnées">🔍</button>
  <div id="csearch-panel" class="csearch-panel" style="display:none">
    <input id="csearch-input" type="text" placeholder="34.688, -1.896 ou lien Maps">
    <button id="csearch-go" class="cs-go" type="button">Chercher le district</button>
    <div id="csearch-result" class="csearch-result"></div>
  </div>
  <button id="geo-follow-btn" class="geo-btn follow" type="button" title="Suivre ma position" style="display:none">🎯</button>
  <button id="geo-btn" class="geo-btn" type="button" title="Me localiser">📍</button>
</div>
<div id="geotoast"></div>
<div id="lightbox"><button id="lbclose" type="button" title="Fermer">✕</button><button id="lbprev" class="lbnav" type="button">‹</button><img id="lbimg" alt="photo"><button id="lbnext" class="lbnav" type="button">›</button><div id="lbcount"></div></div>
<!-- traces.js intégré : tracés persistants des boulevards (rempli par telecharger_traces.py) -->

const SEV_META={1:{label:'Degré 1 — Faible',short:'Faible',color:'#4CAF50'},2:{label:'Degré 2 — Moyen',short:'Moyen',color:'#FFC107'},3:{label:'Degré 3 — Élevé',short:'Élevé',color:'#FF7043'},4:{label:'Degré 4 — Urgent',short:'Urgent',color:'#D32F2F'}};

// Nom du terrain/équipement : 1re ligne de la description, partie française avant le " / " (nom arabe)
function terrainName(p){
  const first=(p.desc||'').split('\n')[0].trim();
  return first.split(' / ')[0].trim()||p.id;
}
// Sous-catégorie effective utilisée pour le filtrage/coloriage : à l'intérieur de
// "Environnement des écoles", on distingue École / Collège / Lycée d'après la description.
// -- Recherche de coordonnées : quel district contient un point x,y donné --
function ringHas(lng,lat,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    const hit=((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}
function districtAtCoord(lat,lng){
  for(const d of GEO.districts){
    for(const part of d.parts){
      if(!part.length)continue;
      if(ringHas(lng,lat,part[0])){
        let inHole=false;
        for(let h=1;h<part.length;h++){if(ringHas(lng,lat,part[h])){inHole=true;break;}}
        if(!inHole)return d.name;
      }
    }
  }
  return null;
}
// Accepte "lat, lng" ou un lien Google Maps (plusieurs formats).
function parseLatLng(text){
  text=(text||'').trim();
  let m=text.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
  if(m)return [parseFloat(m[1]),parseFloat(m[2])];
  m=text.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/); if(m)return [parseFloat(m[1]),parseFloat(m[2])];
  m=text.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/); if(m)return [parseFloat(m[1]),parseFloat(m[2])];
  m=text.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/); if(m)return [parseFloat(m[1]),parseFloat(m[2])];
  return null;
}

function natKey(p){
  if(p.nature==='Environnement des écoles'){
    const d=(p.desc||'').toLowerCase();
    // "Lycée collégial" est la dénomination officielle marocaine d'un COLLÈGE (pas un lycée
    // qualifiant) -> on teste collège/collégial AVANT lycée pour ne pas le mal classer.
    if(/coll[eè]ge|coll[ée]gial/.test(d))return 'Collège';
    if(/lyc[ée]e/.test(d))return 'Lycée';
    if(/[eé]cole/.test(d))return 'École';
    return 'École'; // pas de mot-clé identifié -> regroupé par défaut avec École
  }
  return p.nature;
}
// Pastille de légende/onglet : couleur unifiée pour "Environnement des écoles"
// tant qu'on n'a pas isolé cette nature (comme toutes les autres catégories).
function schoolsIsolated(){
  const activeNat=Object.keys(natureState).filter(k=>natureState[k]!==false);
  return activeNat.length===1 && activeNat[0]==='Environnement des écoles';
}
// Couleur effective d'un point : sous-type (École/Collège/Lycée) seulement une fois
// "Environnement des écoles" isolé ; couleur unifiée de la nature sinon.
function ptColor(p){
  if(p.nature==='Environnement des écoles'&&!schoolsIsolated())return ncolor(p.nature);
  return ncolor(natKey(p));
}

const pctPlugin={id:'pct',afterDatasetsDraw(c){
  const{ctx}=c;const ds=c.data.datasets[0];const total=ds.data.reduce((a,b)=>a+b,0);
  if(!total)return;
  const meta=c.getDatasetMeta(0);
  ctx.save();ctx.font='700 12px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  meta.data.forEach((arc,i)=>{
    const v=ds.data[i];if(!v)return;const p=Math.round(v/total*100);

}};

// Ensemble des noms de "grands axes" d'un district : boulevards nommés + rues résolues des points "Autres".
function grandSet(d){
  if(gsetCache[d])return gsetCache[d];
  const s=new Set();
  ptsOfDistrict(d).forEach(p=>{
    if(isAutres(p)){if(secName[p.id])s.add(normName(secName[p.id]));}
    else if((p.boulevard||'').trim()!=='')s.add(normName(cleanBoulevard(p.boulevard)));
  });
  gsetCache[d]=s;return s;
}
// Un point est "grand axe" s'il a un boulevard nommé, s'il est "Autres",
// ou si sa rue résolue correspond à un grand axe déjà connu (évite le doublon grand/secondaire).
function axisType(p){
  if(isAutres(p))return 'grand';
  if((p.boulevard||'').trim()!=='')return 'grand';
  const nm=secName[p.id];
  return (nm&&grandSet(p.district).has(normName(nm)))?'grand':'sec';
}

function effBoul(p){if((p.boulevard||'').trim()!==''&&!isAutres(p))return cleanBoulevard(p.boulevard);return secName[p.id]||(isAutres(p)?'Autres':'');}

function lsGet(q){try{const v=localStorage.getItem(LSK+q);return v?JSON.parse(v):null;}catch(e){return null;}}

function overpass(q,silent){
  if(ovpCache[q])return Promise.resolve(ovpCache[q]);

  if(!silent)ovpLoad(true);

      const slim={elements:(d.elements||[]).filter(e=>e.geometry).map(e=>({geometry:e.geometry,tags:(e.tags&&e.tags.name)?{name:e.tags.name}:undefined}))};
      ovpCache[q]=slim;lsSet(q,slim);return slim;                // sauvegarde persistante
    })

function prefetchDistrict(name){

  const pts=ptsOfDistrict(name);

    const nm=[...new Set(pts.filter(p=>p.nature===nat).map(p=>searchName(p.boulevard)).filter(Boolean))];
    if(nm.length)jobs.push(`[out:json][timeout:25];way[highway][name~"${nm.map(esc).join('|')}",i](${bbox});out geom;`);
  });
  [...new Set(pts.map(p=>searchName(p.boulevard)).filter(Boolean))].forEach(nm=>{

    statnat.innerHTML=`<span class="nb" style="background:${c}"><span class="d"></span>${activeNat.join(', ')}</span>`;
    statnat.classList.add('show');
  }else{statnat.classList.remove('show');statnat.innerHTML='';}
  if(anyOff){
    // nature isolée -> pas de camembert : total + liste cliquable des boulevards concernés
    chartwrap.style.display='none';
    const cc=activeNat.length===1?ncolor(activeNat[0]):'#0a5c4a';

    if(isSchools){
      // Détail par type d'établissement, propre à "Environnement des écoles", avec vrai compteur.
      // Barre segmentée "Tous / École / Collège / Lycée" — même pattern que le sélecteur d'axes,
      // pour une bascule reconnaissable et en un clic (Loi de Jakob + Loi de Hick).
      const typeCounts={'École':0,'Collège':0,'Lycée':0};
      natActive.forEach(p=>{const k=natKey(p);if(typeCounts[k]!=null)typeCounts[k]++;});
      const thead=document.createElement('div');thead.className='bcount';
      thead.innerHTML='Établissements :';
      body.appendChild(thead);
      const wrap=document.createElement('div');wrap.className='schooltoggle';
      const options=[{t:null,label:'Tous',n:natActive.length}].concat(
        ['École','Collège','Lycée'].map(t=>({t,label:t,n:typeCounts[t]}))
      );
      options.forEach(opt=>{
        const sel=schoolTypeFilter===opt.t;
        const btn=document.createElement('button');btn.type='button';
        btn.className=sel?'on':'';
        if(sel&&opt.t)btn.style.color=ncolor(opt.t);
        btn.innerHTML=opt.t?`<span class="stdot" style="background:${ncolor(opt.t)}"></span>${opt.label}<span class="stcnt">${opt.n}</span>`
                          :`${opt.label}<span class="stcnt">${opt.n}</span>`;
        btn.onclick=()=>{
          if(schoolTypeFilter===opt.t)return; // déjà actif
          pushHistory();
          schoolTypeFilter=opt.t;
          boulFilter=null;
          drawPoints(current);
          if(schoolTypeFilter){
            const ll=natActive.filter(p=>natKey(p)===schoolTypeFilter&&p.lat!=null).map(p=>[p.lat,p.lng]);
            if(ll.length)map.fitBounds(ll,padOpts(17));
            loadBoulevards(current);
          }else{loadBoulevards(current);backToDistrict();}
          buildStats(current);
        };
        wrap.appendChild(btn);
      });
      body.appendChild(wrap);
    }

    if(isTerrains){
      // Degré de sévérité, uniquement pour "Terrains à proximité" et district par district
      chartwrap.style.display='';
      // Le camembert montre TOUJOURS la répartition complète (natActive, pas natActiveEff) :
      // filtrer la vue ne doit pas faire disparaître les autres tranches, juste la liste en dessous.
      const sevCounts={1:0,2:0,3:0,4:0,nr:0};
      natActive.forEach(p=>{sevCounts[sevKeyOf(p)]++;});
      const sevKeys=[1,2,3,4,'nr'].filter(k=>sevCounts[k]>0);
      if(sevKeys.length&&window.Chart){
        const sevChartLabels=sevKeys.map(k=>k==='nr'?'Non renseigné':SEV_META[k].short);
        const sevChartData=sevKeys.map(k=>sevCounts[k]);
        const sevChartCols=sevKeys.map(k=>k==='nr'?SEV_NR_COLOR:SEV_META[k].color);
        chart=new Chart(document.getElementById('chart'),{
          type:'doughnut',
          data:{labels:sevChartLabels,datasets:[{data:sevChartData,backgroundColor:sevChartCols,borderColor:'#fff',borderWidth:2}]},
          options:{plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:11},padding:8}},
            tooltip:{callbacks:{label:(x)=>{const t=x.dataset.data.reduce((a,b)=>a+b,0);
              return ` ${x.label}: ${x.raw} (${Math.round(x.raw/t*100)}%)`;}}}},
            cutout:'55%',responsive:true,maintainAspectRatio:true}
        });
      }
      // Filtre dynamique par degré de sévérité — même pattern que le sélecteur École/Collège/Lycée
      // (loi de Jakob : un mécanisme déjà appris par l'utilisateur, réutilisé tel quel).
      if(sevKeys.length>1){
        const sfHead=document.createElement('div');sfHead.className='bcount';
        sfHead.innerHTML='Filtrer par degré :';
        body.appendChild(sfHead);
        const sfWrap=document.createElement('div');sfWrap.className='schooltoggle';
        const sfOptions=[{k:null,label:'Tous',n:natActive.length}].concat(
          sevKeys.map(k=>({k,label:k==='nr'?'Non renseigné':SEV_META[k].short,n:sevCounts[k]}))
        );
        sfOptions.forEach(opt=>{
          const sel=sevFilter===opt.k;
          const col=opt.k==null?null:(opt.k==='nr'?SEV_NR_COLOR:SEV_META[opt.k].color);
          const btn=document.createElement('button');btn.type='button';
          btn.className=sel?'on':'';
          if(sel&&col)btn.style.color=col;
          btn.innerHTML=col?`<span class="stdot" style="background:${col}"></span>${opt.label}<span class="stcnt">${opt.n}</span>`
                            :`${opt.label}<span class="stcnt">${opt.n}</span>`;
          btn.onclick=()=>{
            if(sevFilter===opt.k)return;
            pushHistory();
            sevFilter=opt.k;
            boulFilter=null;
            drawPoints(current);
            if(sevFilter!=null){
              const ll=natActive.filter(p=>sevKeyOf(p)===sevFilter&&p.lat!=null).map(p=>[p.lat,p.lng]);
              if(ll.length)map.fitBounds(ll,padOpts(17));
              loadBoulevards(current);
            }else{loadBoulevards(current);backToDistrict();}
            buildStats(current);
          };
          sfWrap.appendChild(btn);
        });
        body.appendChild(sfWrap);
      }
      // Liste des terrains recensés (nom + degré de sévérité) — repliée par défaut (le camembert
      // ci-dessus donne déjà la répartition ; pas besoin de la répéter en barres = moins d'affichage).
      const thead=document.createElement('div');thead.className='bcount tlist-toggle';
      thead.innerHTML=`Terrains recensés (${natActiveEff.length}) <span class="chev">▾</span>`;
      body.appendChild(thead);
      const listWrap=document.createElement('div');listWrap.className='tlist-body';
      natActiveEff.slice().sort((a,b)=>terrainName(a).localeCompare(terrainName(b))).forEach(p=>{
        const row=document.createElement('div');row.className='blrow';
        row.innerHTML=`<span class="dot" style="background:${sevColor(p)}"></span><span class="bnm">${terrainName(p)}</span><span class="sevchip" style="color:${sevColor(p)}">${sevShort(p)}</span>`;
        row.title=sevLabel(p);
        row.onclick=()=>openPoint(p);
        listWrap.appendChild(row);
      });
      body.appendChild(listWrap);
      thead.onclick=()=>{thead.classList.toggle('open');listWrap.classList.toggle('open');};
    }

    const boulList=[...new Set(natActiveEff.map(p=>effBoul(p)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const head=document.createElement('div');head.className='bcount';
    head.innerHTML=`Axes concernés :`;
    body.appendChild(head);
    if(!boulList.length){body.insertAdjacentHTML('beforeend','<p style="color:#6b7686;font-size:12.5px;padding:10px 6px">Aucun axe concerné.</p>');return;}
    boulList.forEach(bn=>{
      const sel=boulFilter===bn;
      const row=document.createElement('div');row.className='blrow'+(sel?' sel':'');
      row.innerHTML=`<span class="dot" style="background:${cc}"></span><span class="bnm">${dispBoul(bn)}</span>`;
      row.onclick=()=>{
        pushHistory();
        boulFilter=sel?null:bn;
        drawPoints(current);
        if(boulFilter){
          loadOneBoulevard(bn,current);
          const ll=natActiveEff.filter(p=>effBoul(p)===bn&&p.lat!=null).map(p=>[p.lat,p.lng]);
          if(ll.length)map.fitBounds(ll,padOpts(17));
        }else{loadBoulevards(current);backToDistrict();}
        buildStats(current);
      };
      body.appendChild(row);
    });
    return;
  }
  // toutes les natures -> camembert + barres par nature
  chartwrap.style.display='';
  const labels=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const data=labels.map(l=>counts[l]);
  const cols=labels.map(l=>ncolor(l));
  if(labels.length&&window.Chart){
    chart=new Chart(document.getElementById('chart'),{
      type:'doughnut',
      data:{labels,datasets:[{data,backgroundColor:cols,borderColor:'#fff',borderWidth:2}]},
      options:{plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:11},padding:8}},
        tooltip:{callbacks:{label:(x)=>{const t=x.dataset.data.reduce((a,b)=>a+b,0);
          return ` ${x.label}: ${x.raw} (${Math.round(x.raw/t*100)}%)`;}}}},
        cutout:'55%',responsive:true,maintainAspectRatio:true}
    });
  }
  const max=Math.max(1,...data);
  labels.forEach(nat=>{
    const c=ncolor(nat);const v=counts[nat];
    const row=document.createElement('div');row.className='srow';
    row.innerHTML=`<span class="dot" style="background:${c}"></span><span class="nm">${nat}</span>
      <div class="barwrap"><div class="bar" style="width:${v/max*100}%;background:${c}"></div></div>
      <span class="v">${v}</span>`;
    body.appendChild(row);
  });
  if(!labels.length)body.innerHTML='<p style="color:#6b7686;font-size:12.5px;padding:8px 6px">Aucun point noir recensé dans ce district.</p>';
}

function makeSheetDraggable(sheet){
  const grab=sheet.querySelector('.sheetgrab');if(!grab)return;
  let sy=0,sh=0,drag=false;
  const clamp=h=>Math.max(window.innerHeight*0.22,Math.min(window.innerHeight*0.9,h));
  grab.addEventListener('pointerdown',e=>{drag=true;sy=e.clientY;sh=sheet.getBoundingClientRect().height;sheet.style.transition='none';try{grab.setPointerCapture(e.pointerId);}catch(_){}});
  grab.addEventListener('pointermove',e=>{if(!drag)return;const h=clamp(sh+(sy-e.clientY));sheet.style.height=h+'px';sheet.style.maxHeight=h+'px';});
  const end=()=>{if(!drag)return;drag=false;sheet.style.transition='';const h=sheet.getBoundingClientRect().height;const big=h>window.innerHeight*0.52;const t=Math.round((big?0.86:0.40)*window.innerHeight);sheet.style.height=t+'px';sheet.style.maxHeight=t+'px';};
  grab.addEventListener('pointerup',end);grab.addEventListener('pointercancel',end);
}

// =================== GÉOLOCALISATION ===================
(function(){
  // -- Point-dans-polygone (ray casting), gère les trous (rings > 0 = trous) --
  function pointInRing(lng,lat,ring){
    let inside=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
      const hit=((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
      if(hit)inside=!inside;
    }
    return inside;
  }
  function findDistrictAt(lat,lng){
    for(const d of GEO.districts){
      for(const part of d.parts){
        if(!part.length)continue;
        if(pointInRing(lng,lat,part[0])){
          let inHole=false;
          for(let h=1;h<part.length;h++){if(pointInRing(lng,lat,part[h])){inHole=true;break;}}
          if(!inHole)return d.name;
        }
      }
    }
    return null;
  }
  function haversine(lat1,lng1,lat2,lng2){
    const R=6371000,toRad=x=>x*Math.PI/180;
    const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
    const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(_){}}

  // -- Toast --
  const toastEl=document.getElementById('geotoast');
  let toastTimer=null;
  function showToast(msg,opts){
    opts=opts||{};
    toastEl.textContent=msg;
    toastEl.classList.toggle('warn',!!opts.warn);
    toastEl.style.background=opts.color||'';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),opts.warn?4200:3200);
  }

  // -- État --
  let watchId=null, geoMarker=null, geoCircle=null, geoTrail=null;
  let trailPts=[], lastDistrict=undefined, followMode=false, firstFix=true;
  const alerted=new Set();
  const PROX_M=150; // seuil d'alerte de proximité (mètres)

  function makeIcon(heading){
    const hasHeading = (typeof heading==='number' && !isNaN(heading));
    const html = hasHeading
      ? `<div class="geo-dotwrap" style="transform:rotate(${heading}deg)"><div class="geo-arrow"></div></div>`
      : `<div class="geo-dotwrap"><div class="geo-dot"></div></div>`;
    return L.divIcon({html,className:'',iconSize:[26,26],iconAnchor:[13,13]});
  }

  function updatePosition(pos){
    const {latitude:lat,longitude:lng,accuracy,heading}=pos.coords;

    // Marqueur + cercle de précision
    if(!geoMarker){
      geoMarker=L.marker([lat,lng],{icon:makeIcon(heading),zIndexOffset:2000}).addTo(map);
      geoCircle=L.circle([lat,lng],{radius:accuracy||20,color:'#1a73e8',weight:1,fillColor:'#1a73e8',fillOpacity:.12,interactive:false}).addTo(map);
    }else{
      geoMarker.setLatLng([lat,lng]);
      geoMarker.setIcon(makeIcon(heading));
      geoCircle.setLatLng([lat,lng]);
      geoCircle.setRadius(accuracy||20);
    }

    // Tracé du trajet (on n'ajoute un point que si on a bougé d'au moins ~8m, pour lisser le bruit GPS)
    const lastPt=trailPts[trailPts.length-1];
    if(!lastPt||haversine(lastPt[0],lastPt[1],lat,lng)>8){
      trailPts.push([lat,lng]);
      if(!geoTrail)geoTrail=L.polyline(trailPts,{color:'#1a73e8',weight:4,opacity:.55}).addTo(map);
      else geoTrail.setLatLngs(trailPts);
    }

    // Recentrage : toujours au premier fix, ensuite seulement si "suivre" est actif
    if(firstFix){
      map.setView([lat,lng],17);firstFix=false;
      geoBtn.disabled=false;geoBtn.textContent='🛑';geoBtn.classList.add('on');geoBtn.title='Arrêter la localisation';
      followBtn.style.display='flex';
    }
    else if(followMode){map.panTo([lat,lng]);}

    // Détection du district courant
    const d=findDistrictAt(lat,lng);
    if(d!==lastDistrict){
      lastDistrict=d;
      showToast(d?`Vous êtes maintenant dans : ${d}`:'Hors zone cartographiée',{color:d?(DPAL[d]||'#555f6b'):'#555f6b'});
      vibrate(60);
    }

    // Alerte de proximité aux points noirs déjà recensés
    for(const p of PTS){
      if(alerted.has(p.id))continue;
      const dist=haversine(lat,lng,p.lat,p.lng);
      if(dist<=PROX_M){
        alerted.add(p.id);
        showToast(`⚠️ Point noir à proximité (${p.nature}) — ${Math.round(dist)} m`,{warn:true});
        vibrate([40,60,40]);
      }
    }
  }

  function geoError(err){
    let msg='Localisation impossible.';
    if(err&&err.code===1)msg='Permission de localisation refusée.';
    else if(err&&err.code===2)msg='Position indisponible (GPS/signal faible).';
    else if(err&&err.code===3)msg='Délai de localisation dépassé.';
    showToast(msg,{warn:true});
    stopTracking();
  }

  const geoBtn=document.getElementById('geo-btn');
  const followBtn=document.getElementById('geo-follow-btn');

  function startTracking(){
    if(!('geolocation' in navigator)){showToast('Géolocalisation non supportée par ce navigateur.',{warn:true});return;}
    if(geoBtn.disabled)return; // évite un double-clic pendant l'acquisition
    trailPts=[];alerted.clear();lastDistrict=undefined;firstFix=true;
    geoBtn.disabled=true;geoBtn.textContent='⏳';geoBtn.title='Acquisition en cours…';
    watchId=navigator.geolocation.watchPosition(updatePosition,geoError,{
      enableHighAccuracy:true,maximumAge:2000,timeout:15000
    });
  }
  function stopTracking(){
    if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;}
    geoBtn.disabled=false;geoBtn.textContent='📍';geoBtn.classList.remove('on');geoBtn.title='Me localiser';
    followBtn.style.display='none';followBtn.classList.remove('on');followMode=false;
    if(geoMarker){map.removeLayer(geoMarker);geoMarker=null;}
    if(geoCircle){map.removeLayer(geoCircle);geoCircle=null;}
    if(geoTrail){map.removeLayer(geoTrail);geoTrail=null;}
  }
  geoBtn.onclick=()=>{watchId==null?startTracking():stopTracking();};
  followBtn.onclick=()=>{
    followMode=!followMode;
    followBtn.classList.toggle('on',followMode);
    if(followMode&&geoMarker)map.panTo(geoMarker.getLatLng());
  };

  // -- Positionnement dynamique : le bouton flotte toujours juste à côté/au-dessus
  //    du panneau d'info (bas sur mobile, latéral sur desktop), jamais dessus --
  const geoWrap=document.getElementById('geoloc-wrap');
  function activePanel(){
    const detailEl=document.getElementById('detail'),statsEl=document.getElementById('stats');
    if(detailEl.classList.contains('show'))return detailEl;
    if(statsEl.classList.contains('show'))return statsEl;
    return null;
  }
  function refreshGeoWrapPos(){
    const mobile=window.innerWidth<=680;
    const panel=activePanel();
    if(mobile){
      geoWrap.style.top='';geoWrap.style.transform='';geoWrap.style.right='';
      geoWrap.style.bottom=panel?(panel.getBoundingClientRect().height+14)+'px':'';
    }else{
      geoWrap.style.top='';geoWrap.style.transform='';geoWrap.style.bottom='';
      geoWrap.style.right=panel?(panel.getBoundingClientRect().width+28)+'px':'';
    }
  }
  const geoObs=new MutationObserver(refreshGeoWrapPos);
  ['stats','detail'].forEach(id=>{
    geoObs.observe(document.getElementById(id),{attributes:true,attributeFilter:['class','style']});
  });
  window.addEventListener('resize',refreshGeoWrapPos);
  refreshGeoWrapPos();
})();
